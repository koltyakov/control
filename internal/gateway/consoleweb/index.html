<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Control · Fleet console</title>
    <link rel="icon" href="/console/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/console/static/console.css" />
    <script src="/console/static/console.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <section id="login" class="login-layout" hidden>
      <!-- Decorative gateway orbit; colors and motion come from console.css. -->
      <svg
        class="login-backdrop"
        viewBox="0 0 1440 900"
        preserveAspectRatio="xMidYMid slice"
        aria-hidden="true"
        focusable="false"
      >
        <defs>
          <radialGradient id="login-glow-a">
            <stop offset="0" />
            <stop offset="1" />
          </radialGradient>
          <radialGradient id="login-glow-b">
            <stop offset="0" />
            <stop offset="1" />
          </radialGradient>
          <radialGradient
            id="login-fade"
            gradientUnits="userSpaceOnUse"
            cx="720"
            cy="450"
            r="720"
          >
            <stop offset="0.27" stop-color="#000" />
            <stop offset="0.45" stop-color="#fff" />
          </radialGradient>
          <mask id="login-mask">
            <rect width="1440" height="900" fill="url(#login-fade)" />
          </mask>
          <pattern
            id="login-dots"
            width="24"
            height="24"
            patternUnits="userSpaceOnUse"
          >
            <circle cx="2" cy="2" r="1" />
          </pattern>
        </defs>
        <rect
          class="net-dots"
          width="1440"
          height="900"
          fill="url(#login-dots)"
        />
        <circle cx="160" cy="140" r="560" fill="url(#login-glow-a)" />
        <circle cx="1300" cy="800" r="600" fill="url(#login-glow-b)" />
        <g mask="url(#login-mask)">
          <g class="orbit orbit-1">
            <circle class="ring" cx="720" cy="450" r="260" />
            <circle cx="469.4" cy="519.3" r="3.5" />
            <circle cx="637.5" cy="203.4" r="3" />
            <circle cx="953.7" cy="336.1" r="4" />
            <circle class="hub" cx="782.7" cy="702.3" r="6" />
          </g>
          <g class="orbit orbit-2">
            <circle class="ring" cx="720" cy="450" r="380" />
            <circle
              class="ring-flow"
              pathLength="960"
              cx="720"
              cy="450"
              r="380"
            />
            <circle cx="388.5" cy="635.7" r="4" />
            <circle cx="449.1" cy="183.5" r="3.5" />
            <circle cx="873.3" cy="102.3" r="4" />
            <circle cx="1087.0" cy="351.5" r="4" />
            <circle class="hub" cx="1053.8" cy="631.6" r="6" />
            <circle cx="581.3" cy="803.8" r="3.5" />
          </g>
          <g class="orbit orbit-3">
            <circle class="ring" cx="720" cy="450" r="520" />
            <circle
              class="ring-flow"
              pathLength="1240"
              cx="720"
              cy="450"
              r="520"
            />
            <circle class="hub" cx="459.9" cy="900.3" r="6" />
            <circle class="hub" cx="227.1" cy="615.5" r="6" />
            <circle class="hub" cx="254.4" cy="218.4" r="6" />
            <circle cx="775.1" cy="-67.1" r="4" />
            <circle cx="1198.9" cy="247.3" r="4" />
            <circle cx="1235.3" cy="519.9" r="4" />
            <circle class="hub" cx="979.0" cy="900.9" r="6" />
          </g>
          <g class="orbit orbit-4">
            <circle class="ring" cx="720" cy="450" r="680" />
            <circle cx="756.5" cy="-229.0" r="3.5" />
            <circle class="hub" cx="1097.6" cy="-115.5" r="6" />
            <circle class="hub" cx="1399.9" cy="462.4" r="6" />
            <circle class="hub" cx="1176.6" cy="953.9" r="6" />
            <circle cx="925.9" cy="1098.1" r="3.5" />
            <circle cx="556.5" cy="1110.1" r="4" />
            <circle class="hub" cx="134.6" cy="796.0" r="6" />
            <circle cx="52.9" cy="318.2" r="3" />
            <circle cx="244.5" cy="-36.1" r="3" />
          </g>
        </g>
      </svg>
      <header class="login-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>control
        </div>
        <button
          class="icon-button"
          data-action="theme"
          aria-label="Switch color theme"
        >
          <span data-icon="theme"></span>
        </button>
      </header>
      <div class="login-main">
        <form id="login-form" class="login-card">
          <h1>Sign in</h1>
          <label
            >Username<input
              name="username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              maxlength="64"
              autofocus
          /></label>
          <label
            >Password<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="1024"
          /></label>
          <p id="login-error" class="form-error" role="alert"></p>
          <button type="submit" class="primary wide">Sign in</button>
          <p class="login-help">
            Use the browser login from your gateway operator. CLI account keys
            cannot be used here.
          </p>
        </form>
      </div>
    </section>
    <div id="app" class="app" hidden>
      <header class="console-header">
        <div class="topbar">
          <a
            href="#overview"
            data-page="overview"
            class="brand"
            aria-label="Control overview"
            ><span class="brand-mark" aria-hidden="true"></span>control</a
          >
          <nav aria-label="Main navigation">
            <a href="#machines" data-page="machines"
              ><span data-icon="machine"></span>Machines<span
                id="nav-count"
                class="nav-count"
                >0</span
              ></a
            >
            <a href="#invitations" data-page="invitations"
              ><span data-icon="invitation"></span>Invitations</a
            >
            <a href="#keys" data-page="keys"
              ><span data-icon="key"></span>Access keys</a
            >
            <a href="#activity" data-page="activity"
              ><span data-icon="activity"></span>Activity</a
            >
            <div id="operator-nav" hidden>
              <a href="#users" data-page="users"
                ><span data-icon="users"></span>Accounts</a
              >
              <a href="#updates" data-page="updates"
                ><span data-icon="update"></span>Updates</a
              >
            </div>
            <button
              id="nav-more"
              class="nav-more"
              popovertarget="nav-more-menu"
              aria-label="More pages"
              hidden
            >
              <span data-icon="more"></span>
            </button>
          </nav>
          <div id="nav-more-menu" class="account-menu nav-menu" popover></div>
          <button
            id="account-button"
            class="profile"
            popovertarget="account-menu"
            aria-label="Account menu"
          >
            <span id="avatar" class="avatar">U</span
            ><span id="profile-name">Account</span
            ><span data-icon="chevron"></span>
          </button>
          <div id="account-menu" class="account-menu" popover>
            <div class="menu-identity">
              <strong id="menu-name">Account</strong>
              <small id="menu-role">Fleet owner</small>
            </div>
            <a href="#account" data-page="account" class="menu-item"
              ><span data-icon="settings"></span>Account settings</a
            >
            <div class="menu-theme">
              <span id="theme-label">Theme</span>
              <div class="segmented" role="group" aria-labelledby="theme-label">
                <button data-action="theme" data-theme-choice="system">
                  System
                </button>
                <button data-action="theme" data-theme-choice="light">
                  Light
                </button>
                <button data-action="theme" data-theme-choice="dark">
                  Dark
                </button>
              </div>
            </div>
            <button data-action="logout" class="menu-item">
              <span data-icon="logout"></span>Sign out
            </button>
          </div>
        </div>
      </header>
      <main id="content" tabindex="-1">
        <div class="page-heading">
          <div>
            <h1 id="page-title">Overview</h1>
            <p id="page-description" class="muted"></p>
          </div>
          <div class="heading-actions">
            <button
              data-action="refresh"
              class="secondary square"
              aria-label="Refresh console"
            >
              <span data-icon="refresh"></span>
            </button>
            <button data-action="add" class="primary">
              <span data-icon="plus"></span>Add machine
            </button>
          </div>
        </div>
        <div id="stale-banner" class="banner" role="status" hidden></div>
        <div id="page-content" aria-busy="true">
          <div class="empty panel">Loading fleet…</div>
        </div>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-heading">
        <h2 id="dialog-title" tabindex="-1"></h2>
        <button
          data-action="close"
          class="icon-button"
          aria-label="Close dialog"
        >
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
