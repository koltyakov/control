name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Run this workflow from tag $RELEASE_TAG (current ref: $GITHUB_REF)" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.2.0 or v0.2.0-rc.1" >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Run vet and race tests
        run: make check
      - name: Test WebRTC and relay deployments
        env:
          CONTROL_TEST_SUITE: e2e
        run: make test-compose

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build release signer without secrets
        run: go build -trimpath -o release-tools/control-sign ./cmd/control-sign
      - name: Check public release configuration against compiled pins
        env:
          RELEASE_SIGNING_PUBLIC_KEYS: ${{ vars.RELEASE_SIGNING_PUBLIC_KEYS }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SIGNING_PUBLIC_KEYS" |
            ./release-tools/control-sign --check-keys \
              --repository "$GITHUB_REPOSITORY" --key-id "$RELEASE_SIGNING_KEY_ID"
      - name: Build release bundle
        run: go run ./cmd/control-bundle --version "$RELEASE_TAG"
      - name: Verify bundle checksums
        run: make release-check
      - name: Upload unsigned bundle and signer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: |
            dist/
            release-tools/control-sign
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download this run's unsigned bundle and signer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
      - name: Prepare signer
        run: chmod 700 release-tools/control-sign
      - name: Sign release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" |
            env -u RELEASE_SIGNING_PRIVATE_KEY ./release-tools/control-sign \
              --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
              --key-id "$RELEASE_SIGNING_KEY_ID"
      - name: Verify pinned release signature
        run: ./release-tools/control-sign --check --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/control_* dist/control-manifest.json dist/control-manifest.sig dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
