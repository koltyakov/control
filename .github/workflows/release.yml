name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Run this workflow from tag $RELEASE_TAG (current ref: $GITHUB_REF)" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.2.0 or v0.2.0-rc.1" >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Run vet and race tests
        run: make check
      - name: Test WebRTC and relay deployments
        env:
          CONTROL_TEST_SUITE: e2e
        run: make test-compose

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build release bundle
        run: go run ./cmd/control-bundle --version "$RELEASE_TAG"
      - name: Verify bundle checksums
        run: make release-check
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release metadata
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign sign-blob --yes --bundle dist/control-manifest.json.sigstore.json dist/control-manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
