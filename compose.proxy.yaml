# Gateway proxy isolation fixture, run by tests/compose/test-proxy.sh:
#
#   child ── restricted (internal) ── bridge ── gateway-net (internal) ── gateway
#
# The child shares no network with the gateway and cannot resolve its name.
# The bridge uses tinyproxy by default, or Control's managed listener when
# CONTROL_TEST_MANAGED_PROXY=true.
# Requires Compose 2.36.0+ for stable bridge interface names across restarts.
name: control-proxy-test

x-proxy-host: &proxy-host
  image: control-test-proxy-host
  build:
    context: .
    dockerfile: tests/compose/Dockerfile
    target: proxy-host
  init: true

services:
  certs:
    <<: *proxy-host
    command: ["certs"]
    volumes: ["certs:/certs"]
    network_mode: none

  gateway:
    <<: *proxy-host
    command: ["gateway"]
    environment:
      CONTROL_TOKEN: control-compose-test-only-token
      CONTROL_SUPERUSER_KEY: control-compose-superuser-only-test-key-0001
      CONTROL_PUBLIC_URL: https://gateway.control.test:7443
      CONTROL_RELEASE_REPO: ""
    volumes: ["certs:/certs:ro", "gateway-state:/state"]
    depends_on:
      certs:
        condition: service_completed_successfully
    networks:
      gateway-net:
        aliases: [gateway.control.test]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--resolve", "gateway.control.test:7443:127.0.0.1", "https://gateway.control.test:7443/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  bridge:
    <<: *proxy-host
    command: ["bridge"]
    environment:
      CONTROL_TOKEN: control-compose-test-only-token
      CONTROL_PROXY_ADDRESS: 172.31.250.10
      CONTROL_PROXY_ALLOW: 172.31.250.0/24
      CONTROL_PROXY_MANAGED: ${CONTROL_TEST_MANAGED_PROXY:-false}
    volumes: ["certs:/certs:ro", "bridge-state:/state", "bridge-work:/work"]
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      gateway-net:
        interface_name: eth0
      restricted:
        interface_name: eth1
        ipv4_address: 172.31.250.10
    healthcheck:
      test: ["CMD", "control", "--api", "http://127.0.0.1:7331", "call", "", "node.describe"]
      interval: 2s
      timeout: 5s
      retries: 30

  child:
    image: control-test-restricted-child
    build:
      context: .
      dockerfile: tests/compose/Dockerfile
      target: restricted-child
    init: true
    command: ["child"]
    volumes: ["certs:/certs:ro"]
    depends_on:
      certs:
        condition: service_completed_successfully
    networks:
      restricted:
        ipv4_address: 172.31.250.20

networks:
  gateway-net:
    internal: true
  restricted:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  certs:
  gateway-state:
  bridge-state:
  bridge-work:
